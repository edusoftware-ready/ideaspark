<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Test Bench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 800px; margin: 40px auto; font-family: sans-serif;">
    <h1>AI Test Bench</h1>
    
    <div style="margin-bottom: 20px;">
      <label for="modeSelect"><strong>Generation Mode:</strong></label>
      <select id="modeSelect" style="padding: 8px; font-size: 14px; margin-right: 15px;">
        <option value="ascii">Option 1: Detailed Text (GPT-4o)</option>
        <option value="dalle">Option 2: High-Density Character Art (GPT-4o)</option>
      </select>
    </div>

    <div style="margin-bottom: 20px;">
      <label for="promptInput"><strong>Your Test Prompt:</strong></label><br>
      <textarea id="promptInput" rows="4" style="width: 100%; padding: 10px; font-size: 14px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;" placeholder="e.g., A cybernetic owl skull detailed close-up"></textarea>
    </div>

    <div style="margin-bottom: 20px;">
      <button id="generateBtn" style="padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">Generate</button>
    </div>

    <div id="status" style="font-weight: bold; color: #555; margin-bottom: 10px;">Ready.</div>
    <div id="output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
